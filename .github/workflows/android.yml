name: Android release
on:
  workflow_dispatch:
concurrency:
  group: stoqo-android-release
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      ready: ${{ steps.origins.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: origins
        name: Check production origins
        run: |
          node <<'JS'
          const fs = require('fs');
          const config = require('./mobile/production.json');
          const ready = Boolean(config.api_url && config.web_url);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\n`);
          if (!ready) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Production APK release is waiting for the live API and website origins. No production APK was built.\n');
          JS
  release:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm run typecheck && npm test
        working-directory: mobile
      - name: Configure the release
        run: node scripts/android-config.cjs
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.STOQO_EAS_PROJECT_ID }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.STOQO_GOOGLE_SERVICES_JSON_BASE64 }}
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Retrieve signing credentials using GitHub identity
        run: node scripts/android-signing.cjs
      - name: Build signed APK and Play Store bundle
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
        working-directory: mobile/android
      - name: Verify release signature
        run: node scripts/android-verify.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: stoqo-android-release
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Wait for quality checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/android-quality.cjs
      - name: Publish the installable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "android-0.3.0-${GITHUB_RUN_NUMBER}" mobile/android/app/build/outputs/apk/release/app-release.apk mobile/android/app/build/outputs/bundle/release/app-release.aab --title "Stoqo Android 0.3.0 build ${GITHUB_RUN_NUMBER}" --notes-file docs/android-release-notes.md
