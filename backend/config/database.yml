default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DATABASE_POOL", ENV.fetch("RAILS_MAX_THREADS", 5)) %>
  schema_search_path: <%= ENV.fetch("DATABASE_SCHEMA", "public") %>
  url: <%= ENV.fetch("DATABASE_URL", "postgres://postgres:postgres@localhost:5432/stoqo_development") %>
development:
  <<: *default
test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://postgres:postgres@localhost:5432/stoqo_test") %>
production:
  <<: *default
