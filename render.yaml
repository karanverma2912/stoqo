# Free pilot deployment. Free services sleep and share the workspace's monthly hours.
# Database is the existing Supabase project; no paid Render database/worker/Redis.
services:
  - type: web
    name: stoqo-web
    runtime: node
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ANDROID_RELEASE_CERT_SHA256
        value: "D8:78:02:D8:60:86:A7:6D:22:80:0D:26:FE:40:4D:1F:A6:61:9A:C5:D0:5B:99:A4:6F:DC:25:9E:43:7D:73:DA"
      - key: API_HOST
        fromService: {type: web, name: stoqo-api, property: host}
      - key: API_PORT
        value: "10000"
  - type: web
    name: stoqo-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: "10000"
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: stoqo
      - key: DATABASE_POOL
        value: "12"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: JOB_ADAPTER
        value: solid_queue
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: SOLID_QUEUE_SUPERVISOR_MODE
        value: async
      - key: STORAGE_SERVICE
        value: database
      - key: WEB_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: RELEASE_SIGNING_ENABLED
        value: "true"
      - key: STOQO_FREE_PILOT
        value: "true"
      - key: AI_ENABLED
        value: "false"
      - key: MAIL_DELIVERY_ENABLED
        value: "false"
