<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stoqo • Offline</title><body style="font:18px system-ui;background:#f6f7f8;color:#202321;display:grid;place-items:center;min-height:90vh"><main style="max-width:340px;padding:30px"><h1 id="heading">You’re offline.</h1><p id="message">Your stock is safe. Connect to the internet to view or update your inventory.</p><button id="retry" onclick="location.reload()" style="background:#c6f36b;padding:14px 24px;border:0;border-radius:12px;font:inherit">Try again</button></main><script>try{if(localStorage.getItem('stoqo-language')==='hi'){document.documentElement.lang='hi';document.title='Stoqo • ऑफलाइन';document.getElementById('heading').textContent='आप ऑफलाइन हैं।';document.getElementById('message').textContent='आपका स्टॉक सुरक्षित है। इन्वेंटरी देखने या बदलने के लिए इंटरनेट से जुड़ें।';document.getElementById('retry').textContent='फिर कोशिश करें';}}catch{}</script></body></html>
