name: Android native compilation
on:
  push:
    branches: ['feat/native-ai-notifications']
    paths: ['mobile/**', '.github/workflows/android-native.yml']
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Build a native test binary
        run: ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: stoqo-native-test-only
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
